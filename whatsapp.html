<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahi Tiffin Centre</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
  color:#7b3f00;
}

.card{
  background:#fff;
  padding:15px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card h2{
  margin:0 0 10px;
}

.price{
  font-size:24px;
  font-weight:bold;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

button{
  padding:10px 15px;
  font-size:20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.plus{
  background:green;
  color:white;
}

.minus{
  background:red;
  color:white;
}

.qty{
  font-size:22px;
  font-weight:bold;
  width:30px;
  text-align:center;
}

.total{
  font-size:26px;
  font-weight:bold;
  text-align:center;
  margin-top:20px;
}

.order{
  background:#25D366;
  color:white;
  font-size:18px;
  width:100%;
  margin-top:15px;
  padding:15px;
}
</style>
</head>

<body>

<h1>Mahi Tiffin Centre</h1>

<div class="card item" data-name="Dal Rice" data-price="145">
  <h2>Dal Rice</h2>
  <div class="price">₹145</div>

  <div class="controls">
    <button class="minus">−</button>
    <div class="qty">0</div>
    <button class="plus">+</button>
  </div>
</div>

<div class="card item" data-name="Kadhi Rice" data-price="150">
  <h2>Kadhi Rice</h2>
  <div class="price">₹150</div>

  <div class="controls">
    <button class="minus">−</button>
    <div class="qty">0</div>
    <button class="plus">+</button>
  </div>
</div>

<div class="card item" data-name="Mahi Special Thali" data-price="220">
  <h2>Mahi Special Thali</h2>
  <div class="price">₹220</div>

  <div class="controls">
    <button class="minus">−</button>
    <div class="qty">0</div>
    <button class="plus">+</button>
  </div>
</div>

<div class="total">
  Total: ₹0
</div>

<button class="order">
  🟢 Order on WhatsApp
</button>
<button class="upi" onclick="window.location.href='upi://pay?pa=6378850450@ibl&pn=Mahi%20Tiffin%20Centre&cu=INR'">
💳 Pay Online (UPI)
</button>
<script>

const items = document.querySelectorAll(".item");

function updateTotal(){

  let total = 0;

  let message = "🍽️ *Mahi Tiffin Order*%0A%0A";

  items.forEach(item => {

    const qty = parseInt(item.querySelector(".qty").innerText);
    const price = parseInt(item.dataset.price);

    if(qty > 0){

      total += qty * price;

      message +=
        "✅ " +
        item.dataset.name +
        " x " +
        qty +
        " = ₹" +
        (qty * price) +
        "%0A";
    }

  });

  document.querySelector(".total").innerText =
    "Total: ₹" + total;

  message += "%0A💰 Total: ₹" + total;

  document.querySelector(".order").onclick = function(){

    window.open(
      "https://wa.me/919680042705?text=" + message
    );

  };

}

items.forEach(item => {

  let qty = 0;

  const qtyBox = item.querySelector(".qty");
  const plus = item.querySelector(".plus");
  const minus = item.querySelector(".minus");

  plus.onclick = function(){

    qty++;

    qtyBox.innerText = qty;

    updateTotal();

  };

  minus.onclick = function(){

    if(qty > 0){

      qty--;

      qtyBox.innerText = qty;

      updateTotal();

    }

  };

});

updateTotal();

</script>

</body>
</html>
