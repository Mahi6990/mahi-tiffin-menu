<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahi Tiffin Centre</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#7b3f00;
}

.card{
background:#fff;
padding:15px;
margin:15px 0;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.price{
font-size:24px;
font-weight:bold;
}

.controls{
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
}

button{
padding:10px 15px;
font-size:20px;
border:none;
border-radius:8px;
cursor:pointer;
}

.plus{
background:green;
color:white;
}

.minus{
background:red;
color:white;
}

.order{
background:#25D366;
color:white;
font-size:18px;
width:100%;
margin-top:15px;
padding:15px;
}

.qty{
font-size:22px;
font-weight:bold;
width:30px;
text-align:center;
}

.total{
font-size:26px;
font-weight:bold;
text-align:center;
margin-top:20px;
}

</style>
</head>

<body>

<h1>Mahi Tiffin Centre</h1>

<div class="card">
<h2>Dal Rice</h2>
<div class="price">₹145</div>

<div class="controls">
<button class="minus">-</button>
<div class="qty">0</div>
<button class="plus">+</button>
</div>
</div><div class="card">
<h2>Kadhi Rice</h2>
<div class="price">₹150</div>

<div class="controls">
<button class="minus">-</button>
<div class="qty">0</div>
<button class="plus">+</button>
</div>
</div>

<div class="card">
<h2>Mahi Special Thali</h2>
<div class="price">₹220</div>

<div class="controls">
<button class="minus">-</button>
<div class="qty">0</div>
<button class="plus">+</button>
</div>
</div>

<div class="total">
Total: ₹0
</div>

<button class="order">
🟢 Order on WhatsApp
</button>
<script>
let total = 0;

document.querySelectorAll(".item").forEach(item => {
  let qty = 0;

  const price = parseInt(item.dataset.price);
  const qtyBox = item.querySelector(".qty");
  const plus = item.querySelector(".plus");
  const minus = item.querySelector(".minus");

  plus.onclick = () => {
    qty++;
    qtyBox.innerText = qty;
    updateTotal();
  };

  minus.onclick = () => {
    if (qty > 0) {
      qty--;
      qtyBox.innerText = qty;
      updateTotal();
    }
  };

  function updateTotal() {
    total = 0;
    let message = "🍱 *Mahi Tiffin Order*%0A%0A";

    document.querySelectorAll(".item").forEach(i => {
      const q = parseInt(i.querySelector(".qty").innerText);
      const p = parseInt(i.dataset.price);

      if (q > 0) {
        total += q * p;
        message += "✅ " + i.dataset.name + " x " + q + " = ₹" + (q * p) + "%0A";
      }
    });

    document.querySelector(".total").innerHTML = "Total: ₹" + total;

    message += "%0A💰 Total: ₹" + total;

    document.querySelector(".order").onclick = () => {
      window.open("https://wa.me/919680042705?text=" + message);
    };
  }
});
</script>  
  </body>
</html>
